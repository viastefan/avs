<svg viewBox="0 0 240 268" xmlns="http://www.w3.org/2000/svg">
  <!-- Freigestellt: kein Hintergrund, nur der Körper -->
  <defs>
    <linearGradient id="faceLeft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f6f6f"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="capRight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d3d6da"/>
      <stop offset="100%" stop-color="#b9bec4"/>
    </linearGradient>
  </defs>

  <!-- Aussenkontur -->
  <path d="M120 6 L214 60 C222 65 226 72 226 81 L226 187 C226 196 222 203 214 208 L120 262 L26 208 C18 203 14 196 14 187 L14 81 C14 72 18 65 26 60 Z"
        fill="#0b0b0c" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>

  <!-- Deckflaeche, zweigeteilt -->
  <path d="M120 44 L120 132 L44 90 Z" fill="#0b0b0c"/>
  <path d="M120 44 L196 90 L120 132 Z" fill="url(#capRight)"/>

  <!-- Seitenflaechen -->
  <path d="M44 90 L120 132 L120 224 L44 180 Z" fill="url(#faceLeft)"/>
  <path d="M120 132 L196 90 L196 180 L120 224 Z" fill="url(#faceRight)"/>

  <!-- Kanten -->
  <path d="M120 44 L120 132" stroke="#0b0b0c" stroke-width="2.5" fill="none"/>
  <path d="M120 132 L120 224" stroke="rgba(0,0,0,0.22)" stroke-width="2" fill="none"/>
  <path d="M44 90 L120 132 L196 90" stroke="rgba(0,0,0,0.16)" stroke-width="1.5" fill="none"/>
</svg>
